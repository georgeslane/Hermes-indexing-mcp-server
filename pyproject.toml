[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-digup"
version = "0.1.0"
description = "MCP server that lets Hermes Agent search a DigUp index with EmbeddingGemma 2 running on another machine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hermes-digup = "hermes_digup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
